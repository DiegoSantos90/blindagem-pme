<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛡️ Blindagem PME — Protótipo v2</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      height: 100vh;
    }

    /* ── CSS Variables ── */
    :root {
      --green:       #10b981;
      --green-dark:  #065f46;
      --green-light: #d1fae5;
      --gold:        #fbbf24;
      --gold-dark:   #b45309;
      --blue:        #2563eb;
      --blue-light:  #dbeafe;
      --purple:      #7c3aed;
      --purple-light:#ede9fe;
      --dark:        #0f172a;
      --slate:       #1e293b;
      --slate2:      #334155;
      --muted:       #64748b;
      --border:      #334155;
      --white:       #ffffff;
    }

    /* ══════════════════════════════════════
       SIDEBAR
    ══════════════════════════════════════ */
    #sidebar {
      width: 240px;
      min-width: 240px;
      background: #1e293b;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-brand {
      padding: 20px 20px 16px;
      font-size: 17px;
      font-weight: 900;
      color: var(--green);
      letter-spacing: -0.5px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-brand span { color: var(--gold); }

    /* Profile switcher tabs */
    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-tab {
      flex: 1;
      padding: 10px 4px;
      font-size: 11px;
      font-weight: 700;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      line-height: 1.3;
    }
    .sidebar-tab:hover { background: rgba(255,255,255,0.05); color: #94a3b8; }
    .sidebar-tab.active { background: var(--green); color: var(--white); }

    /* Nav items */
    #sidebar-nav {
      flex: 1;
      padding: 12px 0;
      overflow-y: auto;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-left: 3px solid transparent;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: #e2e8f0; }
    .nav-item.active {
      background: rgba(16,185,129,0.1);
      color: var(--green);
      border-left-color: var(--green);
      font-weight: 700;
    }
    .nav-item .nav-icon { font-size: 16px; flex-shrink: 0; }

    /* User card */
    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--green);
      color: var(--white);
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .user-name { font-size: 13px; font-weight: 700; color: #e2e8f0; }
    .user-role { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ══════════════════════════════════════
       MAIN AREA
    ══════════════════════════════════════ */
    #main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-topbar {
      height: 60px;
      min-height: 60px;
      background: #1e293b;
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .main-topbar h1 { font-size: 18px; font-weight: 700; color: #f1f5f9; }
    .profile-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 99px;
      background: rgba(16,185,129,0.15);
      color: var(--green);
      border: 1px solid rgba(16,185,129,0.3);
    }

    /* Content area */
    #content-area {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
    }

    /* Panels */
    .panel { display: none; }
    .panel.active { display: block; }

    /* Footer */
    .footer {
      background: #0f172a;
      border-top: 1px solid var(--border);
      color: rgba(255,255,255,0.35);
      padding: 12px 32px;
      font-size: 11px;
      text-align: center;
      flex-shrink: 0;
    }
    .footer strong { color: var(--green); }

    /* ══════════════════════════════════════
       COMPONENTES REUTILIZÁVEIS (portados)
    ══════════════════════════════════════ */

    /* Cards */
    .card {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    .card-grid { display: grid; gap: 16px; }
    .card-grid-2 { grid-template-columns: repeat(2, 1fr); }
    .card-grid-3 { grid-template-columns: repeat(3, 1fr); }
    .card-grid-4 { grid-template-columns: repeat(4, 1fr); }

    /* KPI */
    .kpi {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .kpi-value { font-size: 32px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
    .kpi-label { font-size: 13px; color: var(--muted); font-weight: 500; }

    /* Badges */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
    .badge-green  { background: rgba(16,185,129,0.15); color: var(--green); }
    .badge-red    { background: rgba(239,68,68,0.15);  color: #f87171; }
    .badge-yellow { background: rgba(251,191,36,0.15); color: var(--gold); }
    .badge-blue   { background: rgba(37,99,235,0.15);  color: #60a5fa; }
    .badge-purple { background: rgba(124,58,237,0.15); color: #a78bfa; }

    /* Botões */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 8px; font-size: 14px;
      font-weight: 700; cursor: pointer; border: none;
      transition: opacity 0.15s, transform 0.1s; text-decoration: none;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-primary { background: var(--green); color: var(--white); }
    .btn-gold    { background: var(--gold);  color: var(--dark); }
    .btn-outline { background: transparent; border: 2px solid var(--green); color: var(--green); }
    .btn-dark    { background: #0f172a; color: var(--white); border: 1px solid var(--border); }
    .btn-sm      { padding: 7px 14px; font-size: 12px; }

    /* Alerts */
    .alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; line-height: 1.5; }
    .alert-green  { background: rgba(16,185,129,0.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.25); }
    .alert-yellow { background: rgba(251,191,36,0.12); color: var(--gold); border: 1px solid rgba(251,191,36,0.25); }
    .alert-red    { background: rgba(239,68,68,0.12);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.25); }

    /* Tabela */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); border-bottom: 1px solid var(--border); }
    td { padding: 11px 12px; border-bottom: 1px solid rgba(51,65,85,0.5); vertical-align: middle; color: #cbd5e1; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.03); }

    /* Bar chart */
    .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 80px; }
    .bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
    .bar { border-radius: 4px 4px 0 0; width: 100%; }
    .bar-label { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .bar-value  { font-size: 10px; font-weight: 700; }

    /* Section title */
    .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }

    /* Utilities */
    .mb-8  { margin-bottom: 8px; }
    .mb-12 { margin-bottom: 12px; }
    .mb-16 { margin-bottom: 16px; }
    .mb-24 { margin-bottom: 24px; }
    .mb-32 { margin-bottom: 32px; }
    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 24px; }
    .flex  { display: flex; }
    .items-center    { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center  { justify-content: center; }
    .w-full   { width: 100%; }
    .text-center { text-align: center; }
    .text-green  { color: var(--green); }
    .text-gold   { color: var(--gold); }
    .text-muted  { color: var(--muted); }
    .text-white  { color: #f1f5f9; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    /* Mobile frame (Paciente panel) */
    .mobile-frame-wrap {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .mobile-frame {
      width: 340px;
      min-height: 580px;
      background: #0f172a;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
    }
    .mobile-status-bar {
      background: #0f172a;
      padding: 12px 20px 6px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(255,255,255,0.6);
    }
    .mobile-content { flex: 1; padding: 20px; display: flex; flex-direction: column; }
    .mobile-btn {
      background: var(--green); color: var(--white); border: none;
      border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700;
      cursor: pointer; width: 100%; margin-top: auto; transition: opacity 0.15s;
    }
    .mobile-btn:hover { opacity: 0.88; }
    .mobile-input {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; padding: 12px 14px; font-size: 14px; color: #f1f5f9;
      width: 100%; margin-bottom: 10px; outline: none;
    }
    .mobile-input::placeholder { color: rgba(255,255,255,0.35); }

    /* Checkin animations */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop  { 0%{transform:scale(0);opacity:0} 70%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
    .spinner {
      width: 56px; height: 56px;
      border: 4px solid rgba(16,185,129,0.2);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .check-anim {
      width: 72px; height: 72px;
      background: var(--green); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      animation: pop 0.4s ease-out forwards;
    }

    /* Paciente split layout */
    .paciente-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 32px;
      align-items: start;
    }
  </style>
</head>
<body>

  <!-- ── SIDEBAR ── -->
  <aside id="sidebar">
    <div class="sidebar-brand">🛡️ Blindagem <span>PME</span></div>

    <!-- Profile switcher tabs -->
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" id="tab-cfo"      onclick="switchProfile('cfo')">👔 CFO</button>
      <button class="sidebar-tab"        id="tab-corretor" onclick="switchProfile('corretor')">🤝 Corretor</button>
      <button class="sidebar-tab"        id="tab-paciente" onclick="switchProfile('paciente')">📱 Paciente</button>
    </div>

    <!-- Dynamic nav items -->
    <nav id="sidebar-nav"></nav>

    <!-- User card (bottom) -->
    <div class="sidebar-user">
      <div class="user-avatar" id="user-avatar">MA</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Maria Andrade</div>
        <div class="user-role" id="user-role">CFO · TechSol</div>
      </div>
    </div>
  </aside>

  <!-- ── MAIN AREA ── -->
  <div id="main-area">

    <!-- Topbar -->
    <div class="main-topbar">
      <h1 id="page-title">Dashboard</h1>
      <div id="profile-badge" class="profile-badge">👔 CFO · TechSol</div>
    </div>

    <!-- Content panels (one active at a time) -->
    <div id="content-area">

      <!-- CFO panels -->
      <div class="panel" id="cfo-dashboard"><!-- Task 4a --></div>
      <div class="panel" id="cfo-auditorias"><!-- Task 4b --></div>
      <div class="panel" id="cfo-relatorio"><!-- Task 4c --></div>

      <!-- Corretor panels -->
      <div class="panel" id="corretor-carteira"><!-- Task 5a --></div>
      <div class="panel" id="corretor-relatorio"><!-- Task 5b --></div>
      <div class="panel" id="corretor-simulador"><!-- Task 5c --></div>

      <!-- Paciente panel -->
      <div class="panel" id="paciente-checkin"><!-- Task 6 --></div>

    </div><!-- /#content-area -->

    <footer class="footer">
      <strong>Blindagem PME</strong> · FIAP Google Challenge 2026 ·
      Diego Rodolfo dos Santos RM 360717 · Vitor Cidreira Garcia RM 360591 ·
      Pedro Henrique de Aquino Ramim RM 360590 · Raphael Lopes Dantas RM 362263
    </footer>

  </div><!-- /#main-area -->

  <script>
    /* JS goes here in Tasks 3 and 7 */
  </script>

</body>
</html>
